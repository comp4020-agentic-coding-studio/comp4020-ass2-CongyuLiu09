<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <circle cx="380" cy="210" r="150" fill="#1a1a1a" stroke="#f59e0b" stroke-width="4"/>

  <g transform="translate(380,210)">
    <path d="M -80,40 Q -92,-48 -24,-60 L 24,-60 Q 92,-48 80,40 L 68,40 L 68,76 L 44,76 L 44,40 L -44,40 L -44,76 L -68,76 Z"
      fill="none" stroke="#f59e0b" stroke-width="8" stroke-linejoin="round"/>
    <line x1="0" y1="-28" x2="0" y2="8" stroke="#f59e0b" stroke-width="9" stroke-linecap="round"/>
    <circle cx="0" cy="24" r="5" fill="#f59e0b"/>
  </g>

  <!-- callout to the exclamation mark -->
  <path d="M 560 210 L 420 195" fill="none" stroke="#e6e6e6" stroke-width="2.5" marker-end="url(#arrow)"/>
