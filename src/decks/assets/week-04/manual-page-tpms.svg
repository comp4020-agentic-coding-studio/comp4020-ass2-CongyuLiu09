<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- manual page -->
  <rect x="140" y="30" width="480" height="400" fill="#161616" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="380" y="70" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16" font-weight="600">Warning Messages — Tyre Pressure</text>
  <line x1="170" y1="85" x2="590" y2="85" stroke="#e6e6e6" stroke-opacity="0.3"/>

  <!-- small tpms icon illustration -->
  <g transform="translate(210,140)">
    <path d="M -26,13 Q -30,-16 -8,-20 L 8,-20 Q 30,-16 26,13 L 22,13 L 22,26 L 14,26 L 14,13 L -14,13 L -14,26 L -22,26 Z"
      fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-9" x2="0" y2="4" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="2" fill="#f59e0b"/>
  </g>

  <!-- paragraph of explanatory text (as line rules), bracketed -->
  <g stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2">
    <line x1="290" y1="105" x2="590" y2="105"/>
    <line x1="290" y1="122" x2="590" y2="122"/>
    <line x1="290" y1="139" x2="590" y2="139"/>
    <line x1="290" y1="156" x2="470" y2="156"/>
  </g>

  <path d="M 280 96 L 270 96 L 270 165 L 280 165" fill="none" stroke="#c2410c" stroke-width="2.5"/>
  <text x="255" y="210" text-anchor="end" fill="#c2410c" font-family="sans-serif" font-size="15">this paragraph is what</text>
  <text x="255" y="228" text-anchor="end" fill="#c2410c" font-family="sans-serif" font-size="15">the icon is supposed to</text>
  <text x="255" y="246" text-anchor="end" fill="#c2410c" font-family="sans-serif" font-size="15">replace, eventually</text>

  <!-- rest of the page, plain body text -->
  <g stroke="#e6e6e6" stroke-opacity="0.25" stroke-width="2">
    <line x1="170" y1="200" x2="590" y2="200"/>
    <line x1="170" y1="217" x2="590" y2="217"/>
    <line x1="170" y1="234" x2="590" y2="234"/>
    <line x1="170" y1="251" x2="540" y2="251"/>
    <line x1="170" y1="290" x2="590" y2="290"/>
    <line x1="170" y1="307" x2="590" y2="307"/>
    <line x1="170" y1="324" x2="480" y2="324"/>
  </g>
</svg>
