<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- dashboard -->
  <rect x="40" y="300" width="680" height="120" fill="#161616" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>

  <!-- windscreen area -->
  <path d="M 100 50 L 660 50 L 700 300 L 60 300 Z" fill="none" stroke="#e6e6e6" stroke-opacity="0.2" stroke-width="2"/>

  <!-- combiner panel rising from dash -->
  <g transform="translate(380,290) rotate(-20)">
    <rect x="-70" y="-60" width="140" height="60" rx="4" fill="#0d0d0d" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="2"/>
    <text x="0" y="-25" text-anchor="middle" fill="#16a34a" font-family="monospace" font-size="24" font-weight="700">58</text>
  </g>

  <!-- eye line -->
  <circle cx="380" cy="230" r="6" fill="#e6e6e6" fill-opacity="0.6"/>
  <text x="380" y="205" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.6" font-family="sans-serif" font-size="13">driver's eye line</text>

  <path d="M 340 260 L 380 224" fill="none" stroke="#4f46e5" stroke-width="2" stroke-dasharray="5 4"/>
  <text x="470" y="255" text-anchor="middle" fill="#4f46e5" font-family="sans-serif" font-size="13">apparent image</text>
  <text x="470" y="272" text-anchor="middle" fill="#4f46e5" font-family="sans-serif" font-size="13">~2m ahead</text>

  <!-- fraction-of-windscreen callout -->
  <path d="M 310 250 L 450 250 L 450 305 L 310 305 Z" fill="none" stroke="#c2410c" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="380" y="335" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12">small fraction of the windscreen</text>
</svg>
