<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- windscreen frame -->
  <path d="M 60 30 L 700 30 L 740 420 L 20 420 Z" fill="#0d0d0d" stroke="#e6e6e6" stroke-opacity="0.25" stroke-width="2"/>

  <!-- road, perspective lane markings -->
  <path d="M 300 420 L 360 200 L 400 200 L 460 420 Z" fill="#161616"/>
  <path d="M 300 420 L 360 200" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="3"/>
  <path d="M 460 420 L 400 200" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="3"/>
  <g stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="4" stroke-dasharray="16 14">
    <line x1="380" y1="200" x2="380" y2="420"/>
  </g>

  <!-- conformal arrow, matching the road's perspective/curvature -->
  <path d="M 380 400 L 380 300 Q 380 260 420 250 L 460 235 L 445 220 L 500 215 L 480 260 L 465 245 L 425 260 Q 405 268 405 300 L 405 400 Z"
    fill="#16a34a" fill-opacity="0.85"/>

  <!-- dotted outline callout -->
  <path d="M 370 210 L 510 205 L 515 410 L 370 415 Z" fill="none" stroke="#e6e6e6" stroke-width="1.5" stroke-dasharray="5 4" stroke-opacity="0.7"/>
  <text x="620" y="150" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">conformally mapped</text>
  <text x="620" y="170" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">to lane geometry,</text>
  <text x="620" y="190" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">not fixed to</text>
  <text x="620" y="210" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">windscreen position</text>
  <path d="M 560 190 L 500 240" fill="none" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="1.5"/>
</svg>
