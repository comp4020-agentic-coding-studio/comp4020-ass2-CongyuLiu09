<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <rect x="100" y="40" width="560" height="380" rx="10" fill="#141414" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <text x="380" y="75" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16" font-weight="600">Software Update 2026.4.2 — Release Notes</text>
  <line x1="130" y1="90" x2="630" y2="90" stroke="#e6e6e6" stroke-opacity="0.3"/>

  <g fill="#e6e6e6" fill-opacity="0.7" font-family="sans-serif" font-size="13">
    <text x="130" y="125">• Improved map rendering performance</text>
    <text x="130" y="150">• Minor bug fixes and stability improvements</text>
  </g>

  <!-- the one-line changelog entry, bracketed -->
  <rect x="120" y="168" width="500" height="26" fill="#c2410c" fill-opacity="0.15"/>
  <text x="130" y="186" fill="#c2410c" font-family="sans-serif" font-size="13" font-weight="600">• Adjusted forward-collision alert sensitivity threshold</text>

  <path d="M 115 165 L 105 165 L 105 197 L 115 197" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="380" y="240" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="14" font-weight="600">this sentence is the driver's only notice that</text>
  <text x="380" y="260" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="14" font-weight="600">their dashboard's vocabulary just moved</text>

  <g fill="#e6e6e6" fill-opacity="0.5" font-family="sans-serif" font-size="13">
    <text x="130" y="300">• Updated navigation database</text>
    <text x="130" y="325">• General performance improvements</text>
  </g>
</svg>
