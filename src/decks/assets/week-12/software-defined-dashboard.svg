<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- single flat screen, no gauge housings -->
  <rect x="130" y="90" width="500" height="180" rx="10" fill="#0d0d0d" stroke="#4f46e5" stroke-width="3"/>
  <text x="230" y="200" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="28" font-weight="700">72</text>
  <text x="230" y="225" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.6" font-family="sans-serif" font-size="13">mph</text>
  <text x="400" y="200" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="20" font-weight="600">247 km range</text>
  <circle cx="540" cy="180" r="16" fill="none" stroke="#e6e6e6" stroke-width="2.5"/>
  <circle cx="580" cy="180" r="16" fill="none" stroke="#f59e0b" stroke-width="2.5"/>

  <!-- dashed line showing "no housing behind glass" -->
  <line x1="130" y1="280" x2="630" y2="280" stroke="#e6e6e6" stroke-opacity="0.2" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="380" y="305" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.5" font-family="sans-serif" font-size="12">no dedicated gauge housing behind the glass</text>

  <path d="M 590 90 L 590 350" stroke="#4f46e5" stroke-width="2" stroke-dasharray="4 3"/>
  <text x="380" y="380" text-anchor="middle" fill="#4f46e5" font-family="sans-serif" font-size="15" font-weight="600">this whole layout is a build number, not a fixed instrument</text>
</svg>
