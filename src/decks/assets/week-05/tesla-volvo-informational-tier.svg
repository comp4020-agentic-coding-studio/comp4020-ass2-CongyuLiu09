<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- left panel: Tesla-style, blue -->
  <rect x="40" y="60" width="300" height="200" rx="14" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <text x="190" y="90" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">Autopilot active</text>
  <g transform="translate(190,175)">
    <rect x="-55" y="-35" width="110" height="55" rx="10" fill="none" stroke="#3b82f6" stroke-width="4"/>
    <path d="M -30,5 L -8,25 L 32,-15" fill="none" stroke="#3b82f6" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- right panel: Volvo-style, green -->
  <rect x="420" y="60" width="300" height="200" rx="14" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <text x="570" y="90" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">City Safety active</text>
  <g transform="translate(570,175)">
    <rect x="-55" y="-35" width="110" height="55" rx="10" fill="none" stroke="#16a34a" stroke-width="4"/>
    <path d="M -30,5 L -8,25 L 32,-15" fill="none" stroke="#16a34a" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- brace connecting them -->
  <path d="M 340 300 Q 380 330 380 330 Q 380 330 420 300" fill="none" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2"/>
  <text x="380" y="360" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">same tier: informational / confirmation</text>

  <text x="190" y="300" text-anchor="middle" fill="#3b82f6" font-family="sans-serif" font-size="15" font-weight="600">informational tier: blue</text>
  <text x="570" y="300" text-anchor="middle" fill="#16a34a" font-family="sans-serif" font-size="15" font-weight="600">informational tier: green</text>
</svg>
