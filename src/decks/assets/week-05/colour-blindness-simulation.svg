<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- left: normal colour -->
  <rect x="30" y="50" width="320" height="180" rx="12" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <text x="190" y="80" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">normal colour</text>
  <circle cx="110" cy="160" r="26" fill="#1a1a1a" stroke="#dc2626" stroke-width="5"/>
  <circle cx="190" cy="160" r="26" fill="#1a1a1a" stroke="#f59e0b" stroke-width="5"/>
  <circle cx="270" cy="160" r="26" fill="#1a1a1a" stroke="#16a34a" stroke-width="5"/>

  <!-- right: deuteranopia simulated -->
  <rect x="410" y="50" width="320" height="180" rx="12" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <text x="570" y="80" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">deuteranopia simulation</text>
  <circle cx="490" cy="160" r="26" fill="#1a1a1a" stroke="#9a8256" stroke-width="5"/>
  <circle cx="570" cy="160" r="26" fill="#1a1a1a" stroke="#a9905e" stroke-width="5"/>
  <circle cx="650" cy="160" r="26" fill="#1a1a1a" stroke="#9c8b52" stroke-width="5"/>

  <!-- highlight the two that collapse -->
  <ellipse cx="490" cy="160" rx="38" ry="38" fill="none" stroke="#e6e6e6" stroke-width="2" stroke-dasharray="4 3"/>
  <ellipse cx="570" cy="160" rx="38" ry="38" fill="none" stroke="#e6e6e6" stroke-width="2" stroke-dasharray="4 3"/>

  <path d="M 490 205 Q 530 240 570 205" fill="none" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="1.8"/>
  <text x="530" y="260" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15" font-weight="600">same colour now</text>

  <text x="380" y="360" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14" fill-opacity="0.7">brake warning and system-active light, side by side</text>
</svg>
