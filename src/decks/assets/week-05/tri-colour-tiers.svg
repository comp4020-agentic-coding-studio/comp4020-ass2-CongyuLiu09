<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- cluster band -->
  <rect x="60" y="140" width="640" height="90" rx="10" fill="#131313" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <circle cx="180" cy="185" r="26" fill="#1a1a1a" stroke="#dc2626" stroke-width="4"/>
  <circle cx="380" cy="185" r="26" fill="#1a1a1a" stroke="#f59e0b" stroke-width="4"/>
  <circle cx="580" cy="185" r="26" fill="#1a1a1a" stroke="#16a34a" stroke-width="4"/>

  <!-- speedometer below, for context -->
  <circle cx="380" cy="340" r="60" fill="none" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="3"/>

  <!-- labels via arrows -->
  <path d="M 180 240 L 130 300" fill="none" stroke="#dc2626" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="70" y="320" text-anchor="start" fill="#dc2626" font-family="sans-serif" font-size="16" font-weight="600">tier 1 — immediate</text>

  <path d="M 380 240 L 380 275" fill="none" stroke="#f59e0b" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="380" y="300" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="16" font-weight="600">tier 2 — advisory</text>

  <path d="M 580 240 L 630 300" fill="none" stroke="#16a34a" stroke-width="2" marker-end="url(#arrow)"/>
  <text x="640" y="320" text-anchor="end" fill="#16a34a" font-family="sans-serif" font-size="16" font-weight="600">tier 3 — informational</text>
</svg>
