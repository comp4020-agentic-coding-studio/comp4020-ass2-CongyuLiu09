<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow1" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <!-- bezel -->
  <circle cx="300" cy="230" r="190" fill="none" stroke="#e6e6e6" stroke-opacity="0.25" stroke-width="2"/>
  <circle cx="300" cy="230" r="150" fill="none" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="3"/>

  <!-- dial arc E (left) to F (right), sweeping through top -->
  <path d="M 150 230 A 150 150 0 0 1 450 230" fill="none" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="4"/>

  <!-- red zone near E -->
  <path d="M 150 230 A 150 150 0 0 1 185 122" fill="none" stroke="#dc2626" stroke-width="10"/>

  <!-- amber threshold tick, just past the red zone -->
  <line x1="197" y1="99" x2="215" y2="126" stroke="#f59e0b" stroke-width="6"/>

  <!-- ticks -->
  <line x1="150" y1="230" x2="168" y2="230" stroke="#e6e6e6" stroke-width="4"/>
  <line x1="300" y1="80" x2="300" y2="98" stroke="#e6e6e6" stroke-width="4"/>
  <line x1="450" y1="230" x2="432" y2="230" stroke="#e6e6e6" stroke-width="4"/>

  <text x="150" y="270" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="26" font-weight="600">E</text>
  <text x="300" y="66" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="20">1/2</text>
  <text x="450" y="270" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="26" font-weight="600">F</text>

  <!-- needle, resting just above the red zone -->
  <g transform="rotate(-24 300 230)">
    <line x1="300" y1="230" x2="300" y2="100" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round"/>
  </g>
  <circle cx="300" cy="230" r="10" fill="#e6e6e6"/>

  <!-- low-fuel telltale icon, lit amber, beside the dial -->
  <g transform="translate(560,180)">
    <circle r="46" fill="#1a1a1a" stroke="#f59e0b" stroke-width="3"/>
    <path d="M -14,18 L -14,-6 Q -14,-16 -4,-16 L 4,-16 Q 14,-16 14,-6 L 14,18 Z" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <path d="M -14,-6 L 10,-6 L 10,-16" fill="none" stroke="#f59e0b" stroke-width="3.5"/>
    <line x1="-20" y1="26" x2="20" y2="26" stroke="#f59e0b" stroke-width="3.5" stroke-linecap="round"/>
  </g>
  <text x="560" y="252" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="18" font-weight="600">low fuel</text>

  <!-- annotation: arrow from icon to the point on the dial where it switches on -->
  <path d="M 520 190 Q 400 130 232 118" fill="none" stroke="#e6e6e6" stroke-width="2.5" marker-end="url(#arrow1)"/>
  <text x="330" y="105" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16" font-style="italic">switches on here</text>
</svg>
