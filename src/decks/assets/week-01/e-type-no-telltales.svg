<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- dashboard panel -->
  <rect x="20" y="40" width="720" height="360" rx="18" fill="#171512" stroke="#e6e6e6" stroke-opacity="0.35" stroke-width="2"/>

  <!-- twin matching dials: speedometer + tachometer -->
  <circle cx="230" cy="220" r="120" fill="none" stroke="#e6e6e6" stroke-width="4"/>
  <circle cx="230" cy="220" r="120" fill="none" stroke="#e6e6e6" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 10"/>
  <line x1="230" y1="220" x2="230" y2="130" stroke="#e6e6e6" stroke-width="4" stroke-linecap="round" transform="rotate(50 230 220)"/>
  <circle cx="230" cy="220" r="8" fill="#e6e6e6"/>
  <text x="230" y="360" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16">speedometer</text>

  <circle cx="470" cy="220" r="120" fill="none" stroke="#e6e6e6" stroke-width="4"/>
  <circle cx="470" cy="220" r="120" fill="none" stroke="#e6e6e6" stroke-opacity="0.25" stroke-width="1" stroke-dasharray="2 10"/>
  <line x1="470" y1="220" x2="470" y2="130" stroke="#e6e6e6" stroke-width="4" stroke-linecap="round" transform="rotate(-30 470 220)"/>
  <circle cx="470" cy="220" r="8" fill="#e6e6e6"/>
  <path d="M 546 160 A 120 120 0 0 1 566 220" fill="none" stroke="#dc2626" stroke-width="8"/>
  <text x="470" y="360" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16">tachometer</text>

  <!-- small secondary gauges -->
  <circle cx="90" cy="150" r="34" fill="none" stroke="#e6e6e6" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="90" cy="290" r="34" fill="none" stroke="#e6e6e6" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="650" cy="150" r="34" fill="none" stroke="#e6e6e6" stroke-opacity="0.7" stroke-width="2.5"/>
  <circle cx="650" cy="290" r="34" fill="none" stroke="#e6e6e6" stroke-opacity="0.7" stroke-width="2.5"/>

  <!-- toggle switches -->
  <rect x="330" y="330" width="18" height="30" rx="4" fill="#e6e6e6" fill-opacity="0.7"/>
  <rect x="360" y="330" width="18" height="30" rx="4" fill="#e6e6e6" fill-opacity="0.7"/>
  <rect x="390" y="330" width="18" height="30" rx="4" fill="#e6e6e6" fill-opacity="0.7"/>

  <!-- circled empty region where a modern telltale array would sit -->
  <ellipse cx="360" cy="150" rx="90" ry="46" fill="none" stroke="#c2410c" stroke-width="3" stroke-dasharray="6 6"/>
  <text x="360" y="95" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="18" font-weight="600">nothing here in 1961</text>
</svg>
