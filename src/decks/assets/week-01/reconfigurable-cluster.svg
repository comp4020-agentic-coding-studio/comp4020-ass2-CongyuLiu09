<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <!-- two identical screen frames: same hardware -->
  <rect x="30" y="60" width="330" height="220" rx="14" fill="#111111" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="3"/>
  <rect x="400" y="60" width="330" height="220" rx="14" fill="#111111" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="3"/>

  <!-- left: gauge-priority mode -->
  <circle cx="195" cy="170" r="70" fill="none" stroke="#0f766e" stroke-width="6"/>
  <line x1="195" y1="170" x2="195" y2="120" stroke="#e6e6e6" stroke-width="4" stroke-linecap="round" transform="rotate(35 195 170)"/>
  <circle cx="195" cy="170" r="6" fill="#e6e6e6"/>
  <text x="195" y="255" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="18">120</text>
  <text x="195" y="45" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="18" font-weight="600">gauge-priority</text>

  <!-- right: navigation-priority mode, same panel -->
  <path d="M 470 240 L 530 100 L 570 100 L 640 240 Z" fill="none" stroke="#c2410c" stroke-width="4"/>
  <path d="M 555 240 L 552 130" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <path d="M 552 130 L 540 150 M 552 130 L 564 150" fill="none" stroke="#c2410c" stroke-width="8" stroke-linecap="round"/>
  <text x="565" y="45" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="18" font-weight="600">navigation-priority</text>

  <!-- bracket connecting the two, labelled -->
  <path d="M 60 300 L 60 320 L 730 320 L 730 300" fill="none" stroke="#e6e6e6" stroke-width="2.5"/>
  <text x="395" y="355" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="20" font-style="italic">same hardware, different grammar</text>
</svg>
