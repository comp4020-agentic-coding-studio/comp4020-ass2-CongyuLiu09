<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6"/>
    </marker>
  </defs>

  <rect x="30" y="60" width="700" height="300" rx="14" fill="#141414" stroke="#e6e6e6" stroke-opacity="0.35" stroke-width="2"/>

  <!-- large central speedometer -->
  <circle cx="430" cy="210" r="130" fill="none" stroke="#0f766e" stroke-width="6"/>
  <text x="430" y="90" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="18">0–260 km/h</text>
  <line x1="430" y1="210" x2="430" y2="105" stroke="#e6e6e6" stroke-width="5" stroke-linecap="round" transform="rotate(20 430 210)"/>
  <circle cx="430" cy="210" r="8" fill="#e6e6e6"/>

  <!-- smaller tachometer to the left -->
  <circle cx="180" cy="230" r="70" fill="none" stroke="#e6e6e6" stroke-opacity="0.6" stroke-width="3"/>
  <path d="M 232 190 A 70 70 0 0 1 240 230" fill="none" stroke="#dc2626" stroke-width="5"/>
  <text x="180" y="325" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16">0–7 x1000/min</text>

  <!-- annotations -->
  <path d="M 620 130 L 500 155" fill="none" stroke="#0f766e" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="628" y="126" fill="#0f766e" font-family="sans-serif" font-size="16">posted-limit range</text>

  <path d="M 100 130 L 175 185" fill="none" stroke="#dc2626" stroke-width="2.5" marker-end="url(#arrow)"/>
  <text x="30" y="118" fill="#dc2626" font-family="sans-serif" font-size="16">small redline mark</text>
</svg>
