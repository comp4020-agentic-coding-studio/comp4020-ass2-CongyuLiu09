<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e6e6e6" fill-opacity="0.7"/>
    </marker>
  </defs>

  <!-- axis -->
  <line x1="60" y1="360" x2="700" y2="360" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="380" y="400" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="15">time →</text>

  <!-- three clusters of ticks: widely spaced, medium, solid -->
  <g stroke="#0f766e" stroke-width="5" stroke-linecap="round">
    <line x1="100" y1="220" x2="100" y2="280"/>
    <line x1="180" y1="220" x2="180" y2="280"/>
    <line x1="260" y1="220" x2="260" y2="280"/>
  </g>
  <g stroke="#f59e0b" stroke-width="5" stroke-linecap="round">
    <line x1="360" y1="220" x2="360" y2="280"/>
    <line x1="395" y1="220" x2="395" y2="280"/>
    <line x1="430" y1="220" x2="430" y2="280"/>
    <line x1="465" y1="220" x2="465" y2="280"/>
  </g>
  <rect x="540" y="220" width="140" height="60" fill="#dc2626"/>

  <text x="180" y="200" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="15" font-weight="600">1.5m</text>
  <text x="412" y="200" text-anchor="middle" fill="#f59e0b" font-family="sans-serif" font-size="15" font-weight="600">0.5m</text>
  <text x="610" y="200" text-anchor="middle" fill="#dc2626" font-family="sans-serif" font-size="15" font-weight="600">0.1m</text>

  <path d="M 180 300 L 180 320" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 412 300 L 412 320" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <path d="M 610 300 L 610 320" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="380" y="335" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.7" font-family="sans-serif" font-size="13">inter-beep interval shrinking</text>
</svg>
