<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <rect x="100" y="30" width="560" height="400" fill="#161616" stroke="#e6e6e6" stroke-opacity="0.4" stroke-width="2"/>
  <text x="380" y="65" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="16" font-weight="600">Warning Messages — Tyre Pressure</text>
  <line x1="130" y1="80" x2="630" y2="80" stroke="#e6e6e6" stroke-opacity="0.3"/>

  <g font-family="sans-serif" font-size="14" fill="#e6e6e6" fill-opacity="0.85">
    <text x="150" y="115">EN</text>
    <line x1="200" y1="108" x2="480" y2="108" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2"/>

    <text x="150" y="155">DE</text>
    <line x1="200" y1="148" x2="600" y2="148" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2"/>

    <text x="150" y="195">FR</text>
    <line x1="200" y1="188" x2="560" y2="188" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2"/>

    <text x="150" y="235">JA</text>
    <line x1="200" y1="228" x2="420" y2="228" stroke="#e6e6e6" stroke-opacity="0.5" stroke-width="2"/>
  </g>

  <!-- brackets on shortest (JA) and longest (DE) -->
  <path d="M 200 240 L 200 250 L 420 250 L 420 240" fill="none" stroke="#0f766e" stroke-width="2"/>
  <text x="310" y="268" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="12" font-weight="600">shortest</text>

  <path d="M 200 155 L 200 165 L 600 165 L 600 155" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="400" y="180" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12" font-weight="600">longest</text>

  <text x="380" y="330" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.7" font-family="sans-serif" font-size="13">same meaning, different reading-time cost per market</text>

  <g stroke="#e6e6e6" stroke-opacity="0.2" stroke-width="2">
    <line x1="130" y1="290" x2="630" y2="290"/>
    <line x1="130" y1="360" x2="630" y2="360"/>
    <line x1="130" y1="390" x2="500" y2="390"/>
  </g>
</svg>
