<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- left: modern MID plain language -->
  <rect x="40" y="70" width="320" height="180" rx="12" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(200,160)">
    <path d="M -26,13 Q -30,-16 -8,-20 L 8,-20 Q 30,-16 26,13 L 22,13 L 22,26 L 14,26 L 14,13 L -14,13 L -14,26 L -22,26 Z"
      fill="none" stroke="#f59e0b" stroke-width="3" stroke-linejoin="round"/>
    <line x1="0" y1="-9" x2="0" y2="4" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="9" r="2" fill="#f59e0b"/>
  </g>
  <text x="200" y="200" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">"Low tyre pressure —</text>
  <text x="200" y="220" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">check tyres"</text>

  <!-- right: older cluster, icon + acronym -->
  <rect x="400" y="70" width="320" height="180" rx="12" fill="#101010" stroke="#e6e6e6" stroke-opacity="0.3" stroke-width="2"/>
  <g transform="translate(510,150)">
    <path d="M -20,10 Q -24,-12 -6,-16 L 6,-16 Q 24,-12 20,10 L 17,10 L 17,20 L 11,20 L 11,10 L -11,10 L -11,20 L -17,20 Z"
