    <line x1="0" y1="-7" x2="0" y2="3" stroke="#f59e0b" stroke-width="3" stroke-linecap="round"/>
    <circle cx="0" cy="7" r="1.5" fill="#f59e0b"/>
  </g>
  <text x="620" y="155" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="20" font-weight="700">TPMS</text>

  <path d="M 620 175 L 620 210" fill="none" stroke="#c2410c" stroke-width="2"/>
  <text x="620" y="230" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12">meaning lives in the</text>
