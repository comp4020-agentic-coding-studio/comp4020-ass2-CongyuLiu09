<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 460" width="760" height="460">
  <!-- three icon columns -->
  <!-- FCW -->
  <g transform="translate(150,150)">
    <path d="M -40,20 L 0,-36 L 40,20 Z" fill="none" stroke="#e6e6e6" stroke-width="4" stroke-linejoin="round"/>
    <line x1="0" y1="-12" x2="0" y2="6" stroke="#e6e6e6" stroke-width="4" stroke-linecap="round"/>
    <circle cx="0" cy="14" r="2.5" fill="#e6e6e6"/>
  </g>
  <text x="150" y="220" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">forward-collision warning</text>
  <rect x="90" y="235" width="120" height="8" fill="#c2410c"/>
  <text x="150" y="265" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12" font-weight="600">narrates</text>

  <!-- LKA -->
  <g transform="translate(380,150)">
    <rect x="-34" y="-30" width="68" height="48" rx="6" fill="none" stroke="#e6e6e6" stroke-width="4"/>
    <path d="M -14,10 L -14,-14 M 14,10 L 14,-14" stroke="#e6e6e6" stroke-width="3" stroke-dasharray="6 5"/>
    <path d="M -14,-14 L -4,-20" stroke="#e6e6e6" stroke-width="3"/>
  </g>
  <text x="380" y="220" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">lane-keep-assist correction</text>
  <rect x="320" y="235" width="120" height="8" fill="#c2410c"/>
  <text x="380" y="265" text-anchor="middle" fill="#c2410c" font-family="sans-serif" font-size="12" font-weight="600">narrates</text>

  <!-- ACC -->
  <g transform="translate(610,150)">
    <rect x="-28" y="-30" width="56" height="34" rx="6" fill="none" stroke="#e6e6e6" stroke-width="4"/>
    <path d="M -16,20 L -16,4 M 0,20 L 0,4 M 16,20 L 16,4" stroke="#e6e6e6" stroke-width="3"/>
  </g>
  <text x="610" y="220" text-anchor="middle" fill="#e6e6e6" font-family="sans-serif" font-size="14">adaptive-cruise gap alert</text>
  <rect x="550" y="235" width="120" height="8" fill="#0f766e"/>
  <text x="610" y="265" text-anchor="middle" fill="#0f766e" font-family="sans-serif" font-size="12" font-weight="600">reports</text>

  <text x="380" y="330" text-anchor="middle" fill="#e6e6e6" fill-opacity="0.7" font-family="sans-serif" font-size="14">shape alone doesn't reliably signal the category</text>
</svg>
